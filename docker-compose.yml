services:
  clv-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: clv-prediction-api:latest
    container_name: clv-prediction-service
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
